name: Lint C++

on:
  push:
    paths:
      - 'corintho_ai/cpp/src/*.cpp'
      - 'corintho_ai/cpp/include/*.h'
      - 'tests/cpp/src/*.cpp'
      - '.github/workflows/run-lint-cpp.yaml'
      - '.clang-format'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install clang-format
      run: sudo apt-get install -y clang-format-14
    - name: Check C++ formatting
      run: |
        find corintho_ai/cpp -name '*.h' -o -name '*.cpp' | xargs clang-format-14 -i --verbose
        git diff --exit-code
        find tests/cpp -name '*.h' -o -name '*.cpp' | xargs clang-format-14 -i --verbose
        git diff --exit-code
